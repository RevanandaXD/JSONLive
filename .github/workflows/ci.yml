name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci: 
    runs-on: ubuntu-latest

  steps:
    - name: checkout
      uses: actions/checkout@4

    - name: setup-pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.33.2
    
    - name: setup-node
      uses: actions/setup-node@4
      with:
        node-version: 22
        cache: pnpm

    - name: install depedencies
      run: pnpm install --frozen-lockfile
    
    - name: lint
      run: pnpm lint

    - name: build
      run: pnpm run build
      env:
        DATABASE_URL: postgresql://postgres:admin@localhost:5432/jsonlive